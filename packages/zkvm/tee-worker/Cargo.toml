[package]
name = "zkhood-tee-worker"
version = "0.1.0"
edition = "2021"
description = "TEE fast-path worker (Marlin Oyster CVM): executes real REVM batches natively over verified Robinhood Chain state and serves results + a TEE attestation. Option A: TEE for speed, ZK for finality."

[[bin]]
name = "zkhood-tee-worker"
path = "src/main.rs"

[dependencies]
zkhood-revm-executor = { path = "../revm-executor" }
zkhood-robinhood-bridge = { path = "../robinhood-bridge" }
revm = { version = "43", default-features = false, features = ["serde", "std"] }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
eyre = "0.6"
hex = "0.4"
